<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The welcome screen's head, as written in copy.en.ts (the build checks they match; DocumentHead keeps the head in step with the screen once the app runs). Lines with __SITE_URL__ are filled in by a build that knows the site's address (vite/site-metadata.ts) and left out otherwise. -->
    <title>ClauseCompass | Plain-language navigation for legal documents</title>
    <meta name="description" content="A legal document in plain language: the clauses and dates that matter, questions to ask, and a source-cited packet for a lawyer. Information, not legal advice." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta property="og:site_name" content="ClauseCompass" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ClauseCompass | Plain-language navigation for legal documents" />
    <meta property="og:description" content="A legal document in plain language: the clauses and dates that matter, questions to ask, and a source-cited packet for a lawyer. Information, not legal advice." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ClauseCompass: plain-language navigation for legal documents. Information, not legal advice." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClauseCompass | Plain-language navigation for legal documents" />
    <meta name="twitter:description" content="A legal document in plain language: the clauses and dates that matter, questions to ask, and a source-cited packet for a lawyer. Information, not legal advice." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <script>
      // Before the first paint: the theme the reader chose (display-store.ts owns the stored value), or the device's setting, so a dark screen never flashes light.
      (function () {
        var theme = "system";
        try {
          theme = JSON.parse(localStorage.getItem("clausecompass.display") || "{}").theme;
        } catch (error) {
          // No storage, or nothing readable in it: the device's setting, as the store will decide too.
        }
        var dark = theme === "dark" || (theme !== "light" && typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
